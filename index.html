<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Inscripciones VSD</title>
<style>
/* Layout concept: sticky-light command center — global dashboard (KPI strip +
   event ranking bars + hotel ranking), drill into one event via a hash-routed
   detail view with its own breakdown and institution table. Datos: se traen
   automáticamente desde hojas de Google Sheets publicadas como CSV — sin
   subida de archivos ni backend propio. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dee1e6;
  --fg:#15151a; --soft:#5a5a62; --muted:#9a9aa2;
  --accent:#e30613; --accent-d:#b00410; --accent-soft:#fbe4e6; --accent-shadow:rgba(227,6,19,.30); --accent-ink:#ffffff;
  --stable:#23232b; --stable-soft:#e6e6ea; --stable-ink:#ffffff;
  --ok:#1a8a4a; --shadow:0 14px 32px -20px rgba(21,21,26,.35); --radius:14px;
  --font-display:'Helvetica Neue',Arial,'Segoe UI',Roboto,sans-serif;
  --font-body:'Helvetica Neue',Arial,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121216; --surface:#1c1c22; --surface-2:#232329; --line:#313138;
    --fg:#f2f2f4; --soft:#b8b8c0; --muted:#84848d;
    --accent:#ff4d4d; --accent-d:#ff7a7a; --accent-soft:#3a1a1c; --accent-shadow:rgba(255,77,77,.35);
    --stable:#d8d8de; --stable-soft:#33333b; --stable-ink:#16161a;
    --ok:#4ade80; --shadow:0 16px 34px -18px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121216; --surface:#1c1c22; --surface-2:#232329; --line:#313138;
  --fg:#f2f2f4; --soft:#b8b8c0; --muted:#84848d;
  --accent:#ff4d4d; --accent-d:#ff7a7a; --accent-soft:#3a1a1c; --accent-shadow:rgba(255,77,77,.35);
  --stable:#d8d8de; --stable-soft:#33333b; --stable-ink:#16161a;
  --ok:#4ade80; --shadow:0 16px 34px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{font-family:var(--font-body); background:var(--bg); color:var(--fg);}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.app{ max-width:1080px; margin:0 auto; padding-inline:16px; padding-block:20px 56px; display:flex; flex-direction:column; gap:18px; }

.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:14px; min-width:0; }
.brand-logo{ height:46px; width:auto; border-radius:9px; display:block; flex-shrink:0; }
.brand-text{ min-width:0; }
.eyebrow{ display:block; font-size:.68rem; font-weight:800; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin-bottom:2px; }
#viewTitle{ margin:0; font-size:1.32rem; font-weight:900; text-transform:uppercase; letter-spacing:-.01em; line-height:1.05; text-wrap:balance; }

.btn{ border:none; cursor:pointer; font-family:inherit; font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:.76rem; padding:.8em 1.3em; border-radius:50px; white-space:nowrap; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:0 10px 22px -12px var(--accent-shadow); }
.btn-primary:hover{ background:var(--accent-d); }
.btn-primary:disabled{ opacity:.6; cursor:default; }
.btn-ghost{ background:transparent; color:var(--soft); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--muted); color:var(--fg); }
.btn-ghost:disabled{ opacity:.6; cursor:default; }

.crumbs{ display:flex; }
.crumb-back{ background:none; border:none; font-size:.82rem; font-weight:700; color:var(--soft); cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:6px; }
.crumb-back:hover{ color:var(--accent); }

.topbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

@media print{
  body{ background:#fff; }
  .btn-primary, #btnRefresh, #btnDownloadGlobal, #btnDownloadEvent, #btnDownloadAll, .crumb-back, .footer-note, .sync-note{ display:none !important; }
  .section, .kpi{ box-shadow:none; border:1px solid #ccc; }
}

/* Contenedor invisible donde se arma el HTML que se convierte a PDF para
   descargar — vive fuera de la pantalla (no display:none) para que
   html2canvas pueda medirlo y "fotografiarlo" con estilos reales. Fuerza
   el tema claro siempre, sin importar el modo oscuro del visitante, para
   que lo que llega a la imprenta salga siempre con fondo blanco. */
#pdfContainer{ position:absolute; left:-9999px; top:0; width:900px; }
#pdfContainer.pdf-light{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f4f5f8; --line:#dee1e6;
  --fg:#15151a; --soft:#5a5a62; --muted:#9a9aa2;
  --accent:#e30613; --accent-d:#b00410; --accent-soft:#fbe4e6; --accent-shadow:rgba(227,6,19,.30); --accent-ink:#ffffff;
  --stable:#23232b; --stable-soft:#e6e6ea; --stable-ink:#ffffff;
  --ok:#1a8a4a; --shadow:none;
  background:#fff; color:#15151a; padding:24px;
}
.pdf-block{ display:flex; flex-direction:column; gap:18px; margin-bottom:28px; }
.pdf-block + .pdf-block{ break-before:page; page-break-before:always; }
.pdf-title{ font-size:1.15rem; font-weight:900; text-transform:uppercase; letter-spacing:-.01em; margin:0; color:#15151a; }

@keyframes vsdViewIn{
  from{ opacity:0; transform:translateX(22px); }
  to{ opacity:1; transform:translateX(0); }
}
@keyframes vsdViewBack{
  from{ opacity:0; transform:translateX(-16px); }
  to{ opacity:1; transform:translateX(0); }
}
@keyframes vsdCrumbIn{
  from{ opacity:0; transform:translateX(-6px); }
  to{ opacity:1; transform:translateX(0); }
}
.view-enter{ animation:vsdViewIn .38s cubic-bezier(.22,.61,.36,1); }
.view-enter-back{ animation:vsdViewBack .32s cubic-bezier(.22,.61,.36,1); }
.crumbs.crumb-enter{ animation:vsdCrumbIn .38s cubic-bezier(.22,.61,.36,1) .05s both; }



.view{ display:flex; flex-direction:column; gap:18px; }

.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(148px,1fr)); gap:12px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:5px; min-width:0; }
.kpi .value{ font-size:1.65rem; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
.kpi .value.accent{ color:var(--accent); }
.kpi .label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; }
.kpi .sub{ font-size:.76rem; color:var(--soft); }

.section{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; min-width:0; }
.section h2{ margin:0; font-size:.92rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; display:flex; align-items:center; gap:9px; }
.section h2::before{ content:""; width:4px; height:15px; background:var(--accent); border-radius:2px; display:inline-block; flex-shrink:0; }
.section .hint{ font-size:.8rem; color:var(--muted); margin:-6px 0 0; }
.hint-inline{ font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted); font-size:.72rem; margin-left:2px; }

.rank-list{ display:flex; flex-direction:column; gap:10px; }
.rank-row{ display:grid; grid-template-columns:minmax(88px,170px) 1fr auto; align-items:center; gap:12px; }
.rank-label{ font-size:.84rem; font-weight:700; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rank-track{ background:var(--surface-2); border-radius:6px; height:11px; overflow:hidden; min-width:0; }
.rank-fill{ height:100%; background:var(--stable); border-radius:6px; }
.rank-fill.is-top{ background:var(--accent); }
.rank-value{ font-size:.8rem; color:var(--soft); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }

.stat-bar-block{ display:flex; flex-direction:column; gap:6px; }
.stat-bar-label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700; }
.stat-bar{ height:32px; border-radius:8px; overflow:hidden; display:flex; background:var(--surface-2); }
.stat-bar-seg{ display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:800; white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums; }
.stat-bar-seg.habitual{ background:var(--stable); color:var(--stable-ink); }
.stat-bar-seg.nuevo{ background:var(--accent); color:var(--accent-ink); }
.stat-bar-seg.sin{ background:var(--surface-2); color:var(--muted); }

.rank-events{ display:flex; flex-direction:column; gap:12px; }
.event-row{ display:flex; flex-direction:column; gap:8px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); cursor:pointer; }
.event-row:hover{ border-color:var(--accent); }
.event-row-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
.event-row-name{ font-weight:900; text-transform:uppercase; font-size:.9rem; letter-spacing:-.005em; }
.event-row-meta{ font-size:.76rem; color:var(--soft); font-variant-numeric:tabular-nums; }
.event-stackbar{ height:15px; border-radius:5px; overflow:hidden; display:flex; background:var(--surface); }
.event-stackbar .seg.habitual{ background:var(--stable); }
.event-stackbar .seg.nuevo{ background:var(--accent); }

.table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
table{ width:100%; border-collapse:collapse; font-size:.84rem; min-width:580px; }
thead th{ text-align:left; font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:2px solid var(--line); background:var(--surface-2); white-space:nowrap; }
tbody td{ padding:9px 12px; border-bottom:1px solid var(--line); color:var(--soft); vertical-align:top; }
tbody tr:last-child td{ border-bottom:none; }
tbody td.name{ color:var(--fg); font-weight:700; }
.chip{ display:inline-block; font-size:.65rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.chip.nuevo{ background:var(--accent-soft); color:var(--accent-d); }
.chip.habitual{ background:var(--stable-soft); color:var(--fg); }
.chip.sin{ background:var(--surface-2); color:var(--muted); }

.empty-state{ align-items:center; text-align:center; gap:10px; padding:40px 20px; color:var(--soft); }
.empty-state h3{ margin:0; font-size:1.02rem; color:var(--fg); text-transform:uppercase; font-weight:900; }
.empty-state p{ margin:0; max-width:420px; font-size:.87rem; }
.loading{ align-items:center; justify-content:center; padding:56px 20px; color:var(--muted); font-size:.88rem; text-align:center; }

.footer-note{ text-align:center; font-size:.74rem; color:var(--muted); padding-top:6px; }
.sync-note{ text-align:center; font-size:.72rem; color:var(--muted); margin:0; }

@media (max-width:480px){
  .rank-row{ grid-template-columns:1fr; row-gap:4px; }
  .rank-value{ text-align:left; }
  .event-row-top{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>

  /* ---------- helpers ---------- */
  function normKey(s){
    return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  }
  function slugifyReadable(s){
    var out = String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
    return out.slice(0,60) || 'evento';
  }
  function eventSlug(year, monthKey, discipline){
    return String(year) + '-' + String(monthKey||'').toLowerCase() + '-' + slugifyReadable(discipline);
  }
  function fmtInt(n){ return Math.round(n||0).toLocaleString('es-AR'); }
  function fmtPct(n){ if(!isFinite(n)) return '—'; return (n*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'; }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function isArgentina(pais){ var k = normKey(pais); return k==='argentina' || k==='arg' || k==='ar'; }
  var SUMMARY_LABELS = ['total','totales','totalpax','nuevos','habituales','porcentualmentenuevos','porcentualmentehabituales','resumen'].map(normKey);
  function isSummaryRow(name){ return SUMMARY_LABELS.indexOf(normKey(name)) !== -1; }

  function detectFieldMap(headers){
    var map = {}; var used = {};
    Object.keys(FIELD_ALIASES).forEach(function(field){
      var aliases = FIELD_ALIASES[field];
      var found = headers.find(function(h){ return !used[h] && aliases.indexOf(normKey(h)) !== -1; });
      if(found){ map[field] = found; used[found] = true; }
    });
    return map;
  }

  /* Toma las filas ya parseadas del CSV (array de objetos header->valor) y
     devuelve solo las instituciones válidas. Cualquier columna que no sea
     Institución/Provincia/Pais/Pax/Hotel/Habitual-Nuevo (ej: Teléfono, Mail)
     nunca se lee ni se guarda acá. */
  function institutionsFromRows(rows){
    if(!rows || !rows.length) return { institutions:[], fieldMap:{} };
    var headers = Object.keys(rows[0]);
    var fieldMap = detectFieldMap(headers);
    var institutions = [];
    rows.forEach(function(row){
      var nameStr = String(fieldMap.nombre ? row[fieldMap.nombre] : '').trim();
      if(!nameStr || isSummaryRow(nameStr)) return;
      var paxRaw = fieldMap.pax ? row[fieldMap.pax] : '';
      var pax = 0;
      if(paxRaw !== '' && paxRaw != null){
        var n = Number(String(paxRaw).replace(',','.'));
        pax = isFinite(n) ? n : 0;
      }
      var provincia = fieldMap.provincia ? String(row[fieldMap.provincia]||'').trim() : '';
      var pais = fieldMap.pais ? String(row[fieldMap.pais]||'').trim() : '';
      var hotel = fieldMap.hotel ? String(row[fieldMap.hotel]||'').trim() : '';
      var tipoRaw = fieldMap.tipo ? normKey(row[fieldMap.tipo]) : '';
      var tipo = '';
      if(tipoRaw.indexOf('habitual') !== -1) tipo = 'habitual';
      else if(tipoRaw.indexOf('nuevo') !== -1) tipo = 'nuevo';
      institutions.push({ nombre:nameStr, provincia:provincia, pais:pais, pax:pax, hotel:hotel, tipo:tipo });
    });
    return { institutions: institutions, fieldMap: fieldMap };
  }

  function groupCount(list, keyFn){
    var map = {}; var order = [];
    list.forEach(function(it){
      var raw = keyFn(it);
      var label = raw && String(raw).trim() ? String(raw).trim() : 'Sin especificar';
      var key = normKey(label);
      if(!map[key]){ map[key] = { label:label, count:0, pax:0 }; order.push(key); }
      map[key].count++; map[key].pax += (it.pax||0);
    });
    return order.map(function(k){ return map[k]; }).sort(function(a,b){ return b.count-a.count || b.pax-a.pax; });
  }

  function eventStats(ev){
    var insts = ev.institutions || [];
    var totalInst = insts.length;
    var totalPax = insts.reduce(function(s,i){ return s+(i.pax||0); }, 0);
    var habitualInst = insts.filter(function(i){ return i.tipo==='habitual'; }).length;
    var nuevoInst = insts.filter(function(i){ return i.tipo==='nuevo'; }).length;
    var habitualPax = insts.filter(function(i){ return i.tipo==='habitual'; }).reduce(function(s,i){ return s+(i.pax||0); }, 0);
    var nuevoPax = insts.filter(function(i){ return i.tipo==='nuevo'; }).reduce(function(s,i){ return s+(i.pax||0); }, 0);
    var hasGeo = insts.some(function(i){ return i.pais || i.provincia; });
    var arInsts = insts.filter(function(i){ return isArgentina(i.pais); });
    return {
      totalInst: totalInst, totalPax: totalPax,
      habitualInst: habitualInst, nuevoInst: nuevoInst, classifiedInst: habitualInst+nuevoInst,
      habitualPax: habitualPax, nuevoPax: nuevoPax, classifiedPax: habitualPax+nuevoPax,
      hasGeo: hasGeo,
      byCountry: groupCount(insts, function(i){ return i.pais; }),
      arInsts: arInsts,
      byProvinceAR: groupCount(arInsts, function(i){ return i.provincia; }),
      byHotel: groupCount(insts, function(i){ return i.hotel; })
    };
  }

  function renderRankList(list, unit){
    if(!list.length) return '<p class="hint">Sin datos.</p>';
    var max = Math.max.apply(null, [1].concat(list.map(function(x){ return x.count; })));
    return '<div class="rank-list">' + list.map(function(x, idx){
      return '<div class="rank-row"><span class="rank-label" title="'+escapeHtml(x.label)+'">'+escapeHtml(x.label)+'</span>' +
        '<div class="rank-track"><div class="rank-fill'+(idx===0?' is-top':'')+'" style="width:'+(x.count/max*100)+'%"></div></div>' +
        '<span class="rank-value">'+x.count+' '+unit+'</span></div>';
    }).join('') + '</div>';
  }
  function renderHotelRankList(list){
    if(!list.length) return '<p class="hint">Sin datos de hotel.</p>';
    var max = Math.max.apply(null, [1].concat(list.map(function(x){ return x.pax; })));
    return '<div class="rank-list">' + list.map(function(x, idx){
      return '<div class="rank-row"><span class="rank-label" title="'+escapeHtml(x.label)+'">'+escapeHtml(x.label)+'</span>' +
        '<div class="rank-track"><div class="rank-fill'+(idx===0?' is-top':'')+'" style="width:'+(x.pax/max*100)+'%"></div></div>' +
        '<span class="rank-value">'+fmtInt(x.pax)+' pax &middot; '+x.count+' inst.</span></div>';
    }).join('') + '</div>';
  }
  function chipFor(tipo){
    if(tipo==='habitual') return '<span class="chip habitual">Habitual</span>';
    if(tipo==='nuevo') return '<span class="chip nuevo">Nuevo</span>';
    return '<span class="chip sin">Sin clasificar</span>';
  }

  function animateIn(el, animClass){

  /* ---------- render: global dashboard ---------- */
  function renderGlobalHTML(events){
    if(!events.length){
      return '<div class="section empty-state">' +
        '<h3>No hay datos cargados todav&iacute;a</h3>' +
        '<p>Revis&aacute; que las hojas del Google Sheet tengan filas y est&eacute;n publicadas (Archivo &rarr; Compartir &rarr; Publicar en la web), y toc&aacute; "Actualizar".</p>' +
        '</div>';
    }
    var habitualInstTot=0, nuevoInstTot=0, habitualPaxTot=0, nuevoPaxTot=0, allInsts=[];
    var enriched = events.map(function(ev){
      var s = eventStats(ev);
      habitualInstTot += s.habitualInst; nuevoInstTot += s.nuevoInst;
      habitualPaxTot += s.habitualPax; nuevoPaxTot += s.nuevoPax;
      allInsts = allInsts.concat(ev.institutions||[]);
      return { ev:ev, stats:s };
    });
    var classifiedInstTot = habitualInstTot + nuevoInstTot;
    var classifiedPaxTot = habitualPaxTot + nuevoPaxTot;
    var totalPaxAll = allInsts.reduce(function(s,i){ return s+(i.pax||0); }, 0);
    var hotelGlobal = groupCount(allInsts, function(i){ return i.hotel; });
    var sorted = enriched.slice().sort(function(a,b){ return b.stats.totalPax - a.stats.totalPax; });
    var maxPax = Math.max.apply(null, [1].concat(sorted.map(function(x){ return x.stats.totalPax; })));

    var kpi = '<div class="kpi-grid">' +
      '<div class="kpi"><div class="value">'+events.length+'</div><div class="label">Eventos cargados</div></div>' +
      '<div class="kpi"><div class="value">'+fmtInt(allInsts.length)+'</div><div class="label">Instituciones totales</div></div>' +
      '<div class="kpi"><div class="value">'+fmtInt(totalPaxAll)+'</div><div class="label">Pax totales</div></div>' +
      '<div class="kpi"><div class="value">'+fmtInt(habitualInstTot)+'</div><div class="label">Instituciones habituales</div></div>' +
      '<div class="kpi"><div class="value accent">'+fmtInt(nuevoInstTot)+'</div><div class="label">Instituciones nuevas</div><div class="sub">'+(classifiedInstTot?fmtPct(nuevoInstTot/classifiedInstTot):'—')+' del total</div></div>' +
      '<div class="kpi"><div class="value">'+fmtInt(habitualPaxTot)+'</div><div class="label">Pax habituales</div></div>' +
      '<div class="kpi"><div class="value accent">'+fmtInt(nuevoPaxTot)+'</div><div class="label">Pax nuevos</div><div class="sub">'+(classifiedPaxTot?fmtPct(nuevoPaxTot/classifiedPaxTot):'—')+' del total</div></div>' +
      '</div>';

    var ranking = '<section class="section"><h2>Eventos por participaci&oacute;n</h2>' +
      '<p class="hint">Ordenados de mayor a menor cantidad total de pax. El largo de la barra es relativo al evento con m&aacute;s pax.</p>' +
      '<div class="rank-events">' + sorted.map(function(x){
        var ev = x.ev, s = x.stats;
        var scale = maxPax ? (s.totalPax/maxPax*100) : 0;
        var habPct = s.totalPax ? (s.habitualPax/s.totalPax*100) : 0;
        var nuePct = s.totalPax ? (s.nuevoPax/s.totalPax*100) : 0;
        return '<div class="event-row" data-slug="'+escapeHtml(ev.id)+'" tabindex="0" role="button">' +
          '<div class="event-row-top"><span class="event-row-name">'+escapeHtml(ev.label||ev.discipline)+'</span>' +
          '<span class="event-row-meta">'+fmtInt(s.totalPax)+' pax &middot; '+s.totalInst+' instituciones ('+s.habitualInst+' habituales, '+s.nuevoInst+' nuevas)</span></div>' +
          '<div class="event-stackbar" style="width:'+scale+'%"><span class="seg habitual" style="width:'+habPct+'%"></span><span class="seg nuevo" style="width:'+nuePct+'%"></span></div>' +
          '</div>';
      }).join('') + '</div></section>';

    var hotels = '<section class="section"><h2>Pax por hotel &mdash; todas las disciplinas</h2>' +
      '<p class="hint">A qu&eacute; hotel le mandamos m&aacute;s gente en total, sumando todos los eventos cargados.</p>' +
      renderHotelRankList(hotelGlobal) + '</section>';

    return kpi + ranking + hotels;
  }

  /* ---------- render: event detail ---------- */
  function renderEventHTML(ev){
    var s = eventStats(ev);
    var habInstPct = s.classifiedInst ? (s.habitualInst/s.classifiedInst*100) : 0;
    var nueInstPct = s.classifiedInst ? (s.nuevoInst/s.classifiedInst*100) : 100;
    var habPaxPct = s.classifiedPax ? (s.habitualPax/s.classifiedPax*100) : 0;

    var kpi = '<div class="kpi-grid">' +
      '<div class="kpi"><div class="value">'+s.totalInst+'</div><div class="label">Instituciones</div></div>' +
      '<div class="kpi"><div class="value">'+fmtInt(s.totalPax)+'</div><div class="label">Pax totales</div></div>' +
      '<div class="kpi"><div class="value">'+s.habitualInst+'</div><div class="label">Habituales</div></div>' +
      '<div class="kpi"><div class="value accent">'+s.nuevoInst+'</div><div class="label">Nuevas</div><div class="sub">'+(s.classifiedInst?fmtPct(s.nuevoInst/s.classifiedInst):'—')+'</div></div>' +
      '</div>';

    var bars = '<section class="section"><h2>Habituales vs. nuevos</h2>' +

      '<div class="stat-bar-block"><div class="stat-bar-label">Pax</div><div class="stat-bar">' +

        '<div class="stat-bar-seg sin" style="width:100%">Sin clasificar</div>') +
      '</div></div></section>';

    var geoCountry = '<section class="section"><h2>Instituciones por pa&iacute;s</h2>' +
      (s.hasGeo ? renderRankList(s.byCountry, 'inst.') : '<p class="hint">Este evento no tiene datos de pa&iacute;s cargados.</p>') +
      '</section>';

    var geoProvince = '<section class="section"><h2>Instituciones por provincia <span class="hint-inline">(Argentina)</span></h2>' +
      (!s.hasGeo ? '<p class="hint">Este evento no tiene datos de provincia cargados.</p>' :
        (s.arInsts.length ? renderRankList(s.byProvinceAR, 'inst.') + '<p class="hint">Sobre '+s.arInsts.length+' de '+s.totalInst+' instituciones argentinas.</p>' :
          '<p class="hint">No hay instituciones de Argentina en este evento.</p>')) +
      '</section>';

    var hotelSec = '<section class="section"><h2>Pax por hotel</h2>' + renderHotelRankList(s.byHotel) + '</section>';

    var rows = (ev.institutions||[]).map(function(i){
      return '<tr><td class="name">'+escapeHtml(i.nombre)+'</td><td>'+(escapeHtml(i.provincia)||'—')+'</td>' +
        '<td>'+(escapeHtml(i.pais)||'—')+'</td><td>'+fmtInt(i.pax)+'</td>' +
        '<td>'+(escapeHtml(i.hotel)||'—')+'</td><td>'+chipFor(i.tipo)+'</td></tr>';
    }).join('');
    var table = '<section class="section"><h2>Detalle de instituciones</h2><div class="table-wrap"><table>' +
      '<thead><tr><th>Instituci&oacute;n</th><th>Provincia</th><th>Pa&iacute;s</th><th>Pax</th><th>Hotel</th><th>Estado</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></section>';

    return kpi + bars + geoCountry + geoProvince + hotelSec + table;
  }

  /* ---------- descargar en PDF: 3 botones directos, sin diálogo de imprimir ----------
     Arma el contenido en #pdfContainer (fuera de pantalla, siempre en tema
     claro) y usa html2pdf para bajarlo como archivo .pdf listo para mandar
     a la imprenta. */
  function refreshDownloadButtons(){
    btnDownloadEvent.disabled = !currentSlug();
  }

  function slugifyFile(s){
    return String(s||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'archivo';
  }

  function downloadPdf(innerHtml, filename, btn){
    pdfContainer.innerHTML = innerHtml;
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Generando PDF…';
    var opt = {
      margin: 8,
      filename: filename,
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['css','legacy'] }
    };
    html2pdf().set(opt).from(pdfContainer).save().catch(function(err){
      alert('No pudimos generar el PDF. Probá de nuevo en unos segundos.');
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = originalLabel;
      pdfContainer.innerHTML = '';
    });
  }

    var html = '<div class="pdf-block"><h1 class="pdf-title">Panel de inscripciones — VSD Eventos</h1><div class="view">' + renderGlobalHTML(EVENTS) + '</div></div>';
    downloadPdf(html, 'panel-general-vsd.pdf', btnDownloadGlobal);

  btnDownloadEvent.addEventListener('click', function(){

    downloadPdf(html, slugifyFile(ev.label||ev.discipline)+'-vsd.pdf', btnDownloadEvent);

  btnDownloadAll.addEventListener('click', function(){
    var sorted = EVENTS.slice().sort(function(a,b){ return eventStats(b).totalPax - eventStats(a).totalPax; });
    var html = '<div class="pdf-block"><h1 class="pdf-title">Panel de inscripciones — VSD Eventos</h1><div class="view">' + renderGlobalHTML(EVENTS) + '</div></div>';

    });
    downloadPdf(html, 'panel-completo-vsd.pdf', btnDownloadAll);

  /* ---------- carga desde Google Sheets ---------- */
  function fetchSource(source){
    var slug = eventSlug(source.year, source.monthKey, source.discipline);
    var monthLabel = MONTH_MAP[source.monthKey];
    return fetch(source.url, { cache:'no-store' }).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function(csvText){
      var parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
      var result = institutionsFromRows(parsed.data);
      return {
        id: slug, year: source.year, monthKey: source.monthKey, monthLabel: monthLabel,
        discipline: source.discipline, label: source.discipline + ' — ' + monthLabel + ' ' + source.year,
        institutions: result.institutions
      };
    });
  }

  function loadAll(){
    renderLoading();
    btnRefresh.disabled = true;
    syncNoteEl.textContent = '';
    Promise.allSettled(EVENT_SOURCES.map(fetchSource)).then(function(results){
      var events = []; var failedLabels = [];
      results.forEach(function(r, idx){
        if(r.status === 'fulfilled') events.push(r.value);
        else failedLabels.push(EVENT_SOURCES[idx].discipline + ' ' + EVENT_SOURCES[idx].monthKey);
      });
      EVENTS = events;
      renderRoute();
      var now = new Date().toLocaleString('es-AR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
      syncNoteEl.textContent = 'Datos sincronizados desde Google Sheets &middot; '.replace('&middot;','·') + now +
        (failedLabels.length ? ' — no se pudieron traer: ' + failedLabels.join(', ') : '');
    }).finally(function(){
      btnRefresh.disabled = false;
    });
  }

  /* ---------- boot ---------- */
  loadAll();
})();
</script>
</body>
</html>
